name: Update newest YouTube video

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-youtube
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_youtube.py
      - name: Commit if changed
        run: |
          git add data/youtube.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update newest YouTube video"
            git push
          fi
